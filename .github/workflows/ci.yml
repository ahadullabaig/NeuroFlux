name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.4.x" # adjust to a stable 0.x series

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Format Check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type Check
        run: uv run mypy .

      - name: Test
        run: uv run pytest tests/ packages/ --cov=packages/
