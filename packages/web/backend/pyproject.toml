[project]
name = "neuroflux-web"
version = "0.1.0"
description = "NeuroFlux Web Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "neuroflux-core",
    "neuroflux-datasets",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
managed = true

[tool.uv.sources]
neuroflux-core = { workspace = true }
neuroflux-datasets = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
