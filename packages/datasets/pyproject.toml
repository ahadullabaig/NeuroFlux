[project]
name = "neuroflux-datasets"
version = "0.1.0"
description = "Dataset loaders and pipelines for NeuroFlux"
requires-python = ">=3.11"
dependencies = [
    "neuroflux-core",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
    "wfdb>=4.1.0",
    "neurokit2>=0.2.7",
]

[tool.uv.sources]
neuroflux-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
neuroflux-experiment = "neuroflux_datasets.cli:main"
