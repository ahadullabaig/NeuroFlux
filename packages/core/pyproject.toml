[project]
name = "neuroflux-core"
version = "0.1.0"
description = "Core Spiking Neural Network engine for NeuroFlux"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "numba>=0.59.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
