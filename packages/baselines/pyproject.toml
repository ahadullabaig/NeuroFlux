[project]
name = "neuroflux-baselines"
version = "0.1.0"
description = "Conventional and deep learning baseline models for NeuroFlux comparisons"
requires-python = ">=3.11"
dependencies = [
    "neuroflux-core",
    "scipy>=1.12.0",
    "torch>=2.2.0",
]

[tool.uv.sources]
neuroflux-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
