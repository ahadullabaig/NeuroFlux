[project]
name = "neuroflux-workspace"
version = "0.1.0"
description = "NeuroFlux workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/core", "packages/datasets", "packages/baselines"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "mlflow>=2.11.0",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["experiments", "docs", "packages/web"]
