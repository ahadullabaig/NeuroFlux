# R2 follow-up to R1 — re-measure Phase 3's landmark claims with QRS F1.
#
# docs/r2_findings.md §3 compared trained against passive, and 50 against 10
# epochs, in `rpeak_integrity`, which R1 showed does not respond to its input
# (docs/r1_findings.md §2). This sweep re-runs the same slice with the
# annotation-referenced QRS columns populated, so those comparisons can be
# repeated on a metric that measures something.
#
# Slice: the diagnostic settings the passive arm was originally run at
# (flicker 50 Hz, tau 20 ms), all three epoch budgets in one database so
# nothing is merged across files, -5 dB added so the R1 regime boundary is
# covered, and 10 seeds per the roadmap's power commitment.
#
# 16 records x 1 flicker x 5 input SNRs x 3 epoch budgets x 1 tau x 10 seeds
# = 2,400 tasks, ~12 min wall time on a 16-core box.
#
# Usage:
#   uv run neuroflux-experiment run configs/r2/qrs_rescore.yaml \
#     --output-db results/r2_reanalysis/qrs_rescore.db

dataset: mit-bih

record_ids:
  - "100"
  - "101"
  - "103"
  - "105"
  - "108"
  - "112"
  - "113"
  - "119"
  - "200"
  - "207"
  - "212"
  - "214"
  - "228"
  - "231"
  - "232"
  - "234"

flicker_frequencies:
  - 50.0

input_snrs:
  - -5.0
  - 0.0
  - 5.0
  - 10.0
  - 20.0

training_epochs:
  - 0
  - 10
  - 50

stdp_taus:
  - 20.0

flicker_amplitude: 0.5
seeds_per_config: 10
duration_s: 10.0
cache_dir: data/mit_bih
network_layers: [32, 16, 8]
