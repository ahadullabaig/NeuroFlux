# Phase 3A — Baselines + passive SNN sweep on MIT-BIH
#
# Adds three methods (snn_passive, butterworth_notch, lms) onto the same
# evaluation matrix as Phase 3's main sweep (configs/phase3/mit_bih_sweep.yaml).
# The existing 2,560 trained-SNN rows in results/phase3_full_sweep.db are
# already covered, so `snn_trained` is intentionally omitted here to avoid
# re-running it.
#
# Task counts (per _build_phase3_tasks dim-collapse logic):
#   snn_passive       : 16 × 2 × 4 × 1 × 1 × 5 =  640
#   butterworth_notch : 16 × 2 × 4 × 1 × 1 × 5 =  640
#   lms               : 16 × 2 × 4 × 1 × 1 × 5 =  640
#   total                                       = 1,920
#
# Usage:
#   uv run neuroflux-experiment run configs/phase3/phase3a_full_sweep.yaml \
#       --output-db results/phase3_full_sweep.db --dry-run
#   uv run neuroflux-experiment run configs/phase3/phase3a_full_sweep.yaml \
#       --output-db results/phase3_full_sweep.db

dataset: mit-bih

methods:
  - snn_passive
  - butterworth_notch
  - lms

# Identical to mit_bih_sweep.yaml.
record_ids:
  - "100"
  - "101"
  - "103"
  - "105"
  - "108"
  - "112"
  - "113"
  - "119"
  - "200"
  - "207"
  - "212"
  - "214"
  - "228"
  - "231"
  - "232"
  - "234"

flicker_frequencies:
  - 50.0
  - 60.0

input_snrs:
  - 0.0
  - 5.0
  - 10.0
  - 20.0

# Ignored for snn_passive (epochs collapses to [0]) and for baselines
# (both dims collapse). Retained for schema parity with mit_bih_sweep.yaml.
training_epochs:
  - 10
  - 50

stdp_taus:
  - 10.0
  - 20.0

flicker_amplitude: 0.5
seeds_per_config: 5
duration_s: 10.0
cache_dir: data/mit_bih
