# Phase 3 diagnostic — untrained baseline (epochs=0).
#
# Isolates how much of the original sweep's behavior comes from STDP
# learning vs. passive membrane low-pass filtering. With epochs=0, the
# training loop is skipped; only the final eval pass runs, using the
# initial (random) weight matrix and the LIF membrane time constant.
#
# 16 records x 1 flicker x 4 input SNRs x 1 epoch budget x 1 tau x 5 seeds
# = 320 tasks, ~5 min wall time on a 16-core box.
#
# Usage:
#   uv run neuroflux-experiment run \
#     configs/phase3/diagnostic_untrained.yaml \
#     --output-db results/phase3_diagnostics/untrained.db

dataset: mit-bih

record_ids:
  - "100"
  - "101"
  - "103"
  - "105"
  - "108"
  - "112"
  - "113"
  - "119"
  - "200"
  - "207"
  - "212"
  - "214"
  - "228"
  - "231"
  - "232"
  - "234"

flicker_frequencies:
  - 50.0

input_snrs:
  - 0.0
  - 5.0
  - 10.0
  - 20.0

training_epochs:
  - 0

stdp_taus:
  - 20.0

flicker_amplitude: 0.5
seeds_per_config: 5
duration_s: 10.0
cache_dir: data/mit_bih
network_layers: [32, 16, 8]
