# Phase 3 diagnostic — network size sweep, output=8 (current default).
# Tests whether the SNN's output quality scales with output-layer population.
# Uses the high-rpeak record 214 as a clean test substrate.
#
# 1 record x 1 flicker x 2 SNRs x 2 epochs x 1 tau x 5 seeds = 20 tasks.

dataset: mit-bih
record_ids: ["214"]
flicker_frequencies: [50.0]
input_snrs: [0.0, 10.0]
training_epochs: [10, 50]
stdp_taus: [20.0]
flicker_amplitude: 0.5
seeds_per_config: 5
duration_s: 10.0
cache_dir: data/mit_bih
network_layers: [32, 16, 8]
