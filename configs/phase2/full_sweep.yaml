# Full Phase 2 Validation Sweep
#
# Produces 3 × 4 × 4 × 4 × 3 = 576 parameter combos × 10 seeds = 5,760 runs.
# Expected runtime: ~3 hours on an i7-class CPU.
#
# Usage:
#   neuroflux-experiment run configs/phase2/full_sweep.yaml \
#       --output-db experiments/full_results.db

signal_types: [ecg, eeg, sine]

flicker_frequencies: [50.0, 60.0, 100.0, 120.0]

input_snrs: [0.0, 5.0, 10.0, 20.0]

training_epochs: [10, 50, 100, 500]

stdp_taus: [10.0, 20.0, 40.0]

flicker_amplitude: 0.5

seeds_per_config: 10

duration_s: 1.0
